<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="bt-bar" class="site-header">
        <a class="brand" href="index.html">Kareem Ahmed</a>
        <nav class="site-nav">
            <button id="bt-about" class="nav-button" onclick="window.location.href='about.html'">من نحن</button>
            <button id="bt-products" class="nav-button nav-active" onclick="window.location.href='products.html'">المنتجات</button>
            <button id="bt-contact" class="nav-button" onclick="window.location.href='contact.html'">تواصل معنا</button>
            <button id="bt-debug" class="nav-button" onclick="window.location.href='debug.html'">تصحيح</button>
        </nav>
        <div class="site-controls">
            <button class="language-button" data-language="en">EN</button>
            <button class="language-button" data-language="ar">AR</button>
            <button id="theme-toggle" class="theme-button" type="button"></button>
        </div>
    </header>

    <main class="page-shell products-page">
        <section class="page-intro">
            <div>
                <p class="eyebrow" id="products-eyebrow">COLLECTION</p>
                <h1 id="products-title" class="page-title">Products</h1>
            </div>
            <p id="products-intro" class="page-intro-text">Browse the available handcrafted pieces.</p>
        </section>

        <section class="products-container">
            <article class="product-box">
                <div class="product-image-wrap">
                    <img id="product1-img" class="product-img" src="product1-img.jpg" alt="Product 1">
                    <span class="product-index">01</span>
                </div>
                <div class="product-info">
                    <div>
                        <h2 id="prodct-name" class="product-name">سبحة كريستال</h2>
                        <h4 id="product-des" class="product-price">السعر: 40 ج.م</h4>
                    </div>
                    <button id="bt-buy1" class="primary-button cl-buy" onclick="openBuyModal(this.id)">شراء</button>
                </div>
            </article>

            <article class="product-box">
                <div class="product-image-wrap">
                    <img id="product2-img" class="product-img" src="product2-img.jpg" alt="Product 2">
                    <span class="product-index">02</span>
                </div>
                <div class="product-info">
                    <div>
                        <h2 id="prodct-name1" class="product-name">غويشة فيروز</h2>
                        <h4 id="product-des1" class="product-price">السعر: 50 ج.م</h4>
                    </div>
                    <button id="bt-buy2" class="primary-button cl-buy">شراء</button>
                </div>
            </article>

            <article class="product-box">
                <div class="product-image-wrap">
                    <img id="product3-img" class="product-img" src="product3-img.jpg" alt="Product 3">
                    <span class="product-index">03</span>
                </div>
                <div class="product-info">
                    <div>
                        <h2 id="prodct-name2" class="product-name">ميدالية فيروز</h2>
                        <h4 id="product-des2" class="product-price">السعر: 50 ج.م</h4>
                    </div>
                    <button id="bt-buy3" class="primary-button cl-buy">شراء</button>
                </div>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
